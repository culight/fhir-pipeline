name: Setup Snowflake Schema

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE || 'DMDEV_WH' }}
      SNOWFLAKE_DB: ${{ vars.SNOWFLAKE_DB || 'FHIR_DB' }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA || 'FHIR_PIPELINE_SCHEMA_RAW' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Snowflake setup
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: python infra/setup_snowflake.py
